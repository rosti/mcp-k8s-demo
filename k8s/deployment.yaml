##############################################################
# Secret — the actual database credentials
# In production this comes from Vault, External Secrets, etc.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
  labels:
    app: order-service
    component: config
type: Opaque
stringData:
  db-credentials.json: |
    {
      "db_host": "postgres.database.svc.cluster.local",
      "db_password": "super-secret-password-123",
      "db_name": "orders_production"
    }

---
##############################################################
# Deployment — fixed mount path
#
# The app expects config at:  /app/config/db-credentials.json
# The secret is now mounted at /app/config/db-credentials.json
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
  labels:
    app: order-service
    version: v1.2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1.2.0
    spec:
      containers:
        - name: order-service
          image: velmira/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"

          volumeMounts:
            - name: db-config
              mountPath: /app/config
              readOnly: true

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: db-config
          secret:
            secretName: db-credentials

---
# Service — exposes the pods
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
