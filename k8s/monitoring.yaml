# Namespace for monitoring stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# Prometheus ConfigMap — scrape config + alert rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s       # fast for demo — normally 15-30s
      evaluation_interval: 5s

    # Connect to AlertManager
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    # Load alert rules
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    # Scrape targets
    scrape_configs:
      # Scrape the order-service /metrics endpoint
      - job_name: "order-service"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["demo"]
        relabel_configs:
          # Only scrape endpoints with the label app=order-service
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: order-service
          # Use the service port named "http"
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
        # Override the metrics path — our Go app exposes /metrics
        metrics_path: /metrics

      # Scrape Prometheus itself
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

 
  # Alert rules — this is what triggers the demo
  alert_rules.yml: |
    groups:
      - name: order-service-alerts
        rules:
          # Alert 1: High error rate
          # Fires when the order-service has any failed requests
          - alert: HighErrorRate
            expr: |
              (
                increase(order_service_failed_requests[1m]) > 0
              )
            for: 10s        # fires fast for demo — normally 5m
            labels:
              severity: critical
              service: order-service
              namespace: demo
            annotations:
              summary: "Order service has high error rate"
              description: >
                The order-service in namespace demo has
                {{ $value }} failed requests in the last minute.
                All /api/orders requests are returning HTTP 500.
              runbook: "Check pod logs and deployment config."

          # Alert 2: Orders endpoint returning errors
          # (alternative rule using the ratio of failures)
          - alert: OrdersEndpointDown
            expr: |
              (
                order_service_failed_requests
                /
                (order_service_total_requests > 0)
              ) > 0.5
            for: 10s
            labels:
              severity: critical
              service: order-service
              namespace: demo
            annotations:
              summary: "Orders endpoint error rate > 50%"
              description: >
                More than 50% of requests to /api/orders
                are failing. Service is effectively down
                for business operations while health checks pass.

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=1h"  # short retention for demo
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alert_rules.yml
              subPath: alert_rules.yml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http

---
# Prometheus ServiceAccount + RBAC
# (needed to discover pods/services/endpoints)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
# AlertManager ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: "webhook-bridge"
      group_by: ["alertname", "namespace", "service"]
      group_wait: 5s        # fast for demo
      group_interval: 10s
      repeat_interval: 1m   # re-alert quickly for demo

    receivers:
      # Webhook receiver — sends alerts to our bridge
      # The bridge will forward to OpenClaw
      - name: "webhook-bridge"
        webhook_configs:
          - url: "http://alert-bridge.monitoring.svc:5000/alert"
            send_resolved: true

---
# AlertManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config

---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http