apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-bridge-config
  namespace: monitoring
data:
  bridge.py: |
    import json
    import os
    import urllib.request
    import urllib.error
    from http.server import HTTPServer, BaseHTTPRequestHandler

    DISCORD_WEBHOOK_URL = os.environ.get("DISCORD_WEBHOOK_URL", "")
    SRE_BOT_ID = os.environ.get("SRE_BOT_ID", "")
    PORT = int(os.environ.get("PORT", "5000"))

    class AlertHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(content_length)

            try:
                alert_data = json.loads(body)
            except json.JSONDecodeError:
                self.send_response(400)
                self.end_headers()
                self.wfile.write(b"Invalid JSON")
                return

            alerts = alert_data.get("alerts", [])
            for alert in alerts:
                status = alert.get("status", "unknown").upper()
                labels = alert.get("labels", {})
                annotations = alert.get("annotations", {})

                alertname = labels.get("alertname", "Unknown")
                severity = labels.get("severity", "unknown")
                namespace = labels.get("namespace", "unknown")
                service = labels.get("service", "unknown")
                summary = annotations.get("summary", "No summary")
                description = annotations.get("description", "No description")

                mention = f"<@{SRE_BOT_ID}>" if SRE_BOT_ID else "@sre-bot"

                message = (
                    f"**[{status}]** `{alertname}`\n\n"
                    f"**Labels:**\n```\n"
                    f"alertname: {alertname}\n"
                    f"severity: {severity}\n"
                    f"namespace: {namespace}\n"
                    f"service: {service}\n"
                    f"status: {status.lower()}\n```\n"
                    f"**Summary:** {summary}\n"
                    f"**Description:** {description}\n\n"
                    f"{mention} Please investigate this alert."
                )

                payload = json.dumps({
                    "content": message,
                    "username": "AlertManager"
                }).encode("utf-8")

                req = urllib.request.Request(
                    DISCORD_WEBHOOK_URL,
                    data=payload,
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )

                try:
                    urllib.request.urlopen(req, timeout=10)
                    print(f"Sent alert: {alertname}", flush=True)
                except Exception as e:
                    print(f"Failed to send: {e}", flush=True)

            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"OK")

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"OK")

    if __name__ == "__main__":
        if not DISCORD_WEBHOOK_URL:
            print("Missing DISCORD_WEBHOOK_URL", flush=True)
            exit(1)

        print(f"Starting on :{PORT}", flush=True)
        HTTPServer(("0.0.0.0", PORT), AlertHandler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-bridge
  template:
    metadata:
      labels:
        app: alert-bridge
    spec:
      containers:
        - name: alert-bridge
          image: python:3.12-alpine
          command: ["python", "/app/bridge.py"]

          ports:
            - containerPort: 5000
              name: http

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-bridge-secrets
                  key: DISCORD_WEBHOOK_URL

            - name: SRE_BOT_ID
              valueFrom:
                secretKeyRef:
                  name: alert-bridge-secrets
                  key: SRE_BOT_ID

            - name: PORT
              value: "5000"

          volumeMounts:
            - name: bridge-code
              mountPath: /app

      volumes:
        - name: bridge-code
          configMap:
            name: alert-bridge-config

---
apiVersion: v1
kind: Service
metadata:
  name: alert-bridge
  namespace: monitoring
spec:
  selector:
    app: alert-bridge
  ports:
    - port: 5000
      targetPort: http
      name: http
  type: ClusterIP